<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">

  {%- include head.html -%}

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Skeleton shimmer animation for loading state */
    @keyframes skeleton-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .gallery {
      position: relative;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s infinite;
      border-radius: 6px;
      overflow: hidden;
      /* Default aspect ratio reservation prevents layout jump before load */
      aspect-ratio: 4 / 3; 
    }

    /* When image loads, background skeleton is disabled */
    .gallery.loaded {
      animation: none;
      background: transparent;
      aspect-ratio: auto;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s ease-out, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
      backface-visibility: hidden;
    }

    /* Fade in smoothly once image is fully decoded */
    .gallery img.loaded {
      opacity: 1;
    }

    .gallery img:hover {
      transform: scale(1.03);
    }

    /* Grid layout styling */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Masonry layout styling */
    .masonry {
      column-count: 1;
      column-gap: 20px;
      padding: 20px;
    }
    
    @media (min-width: 600px) {
      .masonry { column-count: 2; }
    }
    
    @media (min-width: 900px) {
      .masonry { column-count: 3; }
    }
    
    .masonry .gallery {
      display: inline-block;
      width: 100%;
      margin: 0 0 20px;
      break-inside: avoid;
    }
    
    /* Modal / Lightbox styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal.show {
      opacity: 1;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      transition: opacity 0.2s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      z-index: 1002;
      user-select: none;
    }

    a.prev, a.next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      padding: 16px;
      text-decoration: none;
      z-index: 1001;
      user-select: none;
      border-radius: 50%;
      transition: background-color 0.2s ease;
    }
    
    a.prev:hover, a.next:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }
    
    a.prev { left: 20px; }
    a.next { right: 20px; }
  </style>

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

  </body>
</html>
