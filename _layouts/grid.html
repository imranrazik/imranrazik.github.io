
<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: sans-serif;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    
    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0;
      padding: 0;
      border-radius: 6px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .album-card {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .album-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border-radius: 6px;
      transition: transform 0.3s ease;
    }

    .album-card:hover img {
      transform: scale(1.03);
    }

    .album-title {
      text-align: center;
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    /* Back link on individual gallery pages */
    .back-link {
      display: inline-block;
      margin: 10px 20px;
      text-decoration: none;
      color: #555;
      font-size: 0.95rem;
    }

    .back-link:hover {
      color: #000;
    }

    /* Modal styling */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.95);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-content img {
      max-width: 90vw;
      max-height: 90vh;
      margin: auto;
      display: block;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 35px;
      color: #444;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
      background-color: transparent;
      border: none;
    }

    .close:hover,
    .close:focus {
      color: #222;
      text-decoration: none;
    }

    a.prev, a.next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      color: #444;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      padding: 16px;
      text-decoration: none;
      z-index: 1001;
      transition: background-color 0.2s ease;
    }

    a.prev:hover,
    a.next:hover {
      background-color: rgba(0, 0, 0, 0.3);
      color: #222;
    }

    a.prev {
      left: 20px;
    }

    a.next {
      right: 20px;
    }
  </style>

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <!-- Shared Lightbox Modal -->
    <div id="modal" class="modal">
      <span class="close" onclick="closeModal()">&times;</span>
      <div class="modal-content">
        <img id="modal-image" src="" alt="">
        <a class="prev" onclick="changeSlide(-1)">&#10094;</a>
        <a class="next" onclick="changeSlide(1)">&#10095;</a>
      </div>
    </div>

    <script>
      const images = Array.from(document.querySelectorAll(".gallery img"));
      const modal = document.getElementById("modal");
      const modalImage = document.getElementById("modal-image");
      let currentIndex = 0;

      if (modal && images.length > 0) {
        images.forEach((img, index) => {
          img.addEventListener("click", () => {
            currentIndex = index;
            openModal();
          });
        });

        modal.addEventListener("click", function (e) {
          if (!e.target.closest(".modal-content")) {
            closeModal();
          }
        });

        modalImage.addEventListener("click", function (e) {
          e.stopPropagation();
        });

        document.addEventListener("keydown", function (e) {
          if (modal.style.display === "flex") {
            if (e.key === "ArrowLeft") {
              changeSlide(-1);
            } else if (e.key === "ArrowRight") {
              changeSlide(1);
            } else if (e.key === "Escape") {
              closeModal();
            }
          }
        });
      }

      function openModal() {
        modal.style.display = "flex";
        showSlide(currentIndex);
      }

      function closeModal() {
        modal.style.display = "none";
      }

      function changeSlide(n) {
        currentIndex = (currentIndex + n + images.length) % images.length;
        showSlide(currentIndex);
      }

      function showSlide(index) {
        modalImage.src = images[index].src;
        modalImage.alt = images[index].alt;
      }
    </script>

  </body>

</html>
